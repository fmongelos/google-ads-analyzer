<body>
<title>Leyendas del Toque</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: una sola pantalla vertical — barra superior, arena de combate, barra de habilidades, panel con pestañas abajo. Estética única de noche en Brumaluz (oscura por elección). */
:root {
  --bg: #10172a;
  --panel: #19233d;
  --panel-2: #23304f;
  --line: #2f3d61;
  --text: #eef1f8;
  --muted: #97a3c2;
  --gold: #f4b63f;
  --gem: #6cd4ea;
  --hp: #e8505b;
  --good: #5cc98d;
  --violet: #b38cff;
  --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--gem); outline-offset: 2px; }
#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }

/* Barra superior */
.top { display: flex; align-items: center; gap: 8px; padding-block: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.res { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 6px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 0; }
.coin, .gemi { width: 18px; height: 18px; flex: none; display: inline-block; }
.coin { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe9a8, var(--gold) 55%, #b9771a); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
.gemi { background: linear-gradient(135deg, #c8f6ff, var(--gem) 50%, #2a8fb0); clip-path: polygon(50% 0, 100% 38%, 50% 100%, 0 38%); }
.coin.sm, .gemi.sm { width: 13px; height: 13px; vertical-align: -2px; }
.stage-chip { margin-left: auto; font-family: var(--font-display); font-size: 17px; letter-spacing: .5px; }
.icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; flex: none; }

/* Arena */
.arena { position: relative; flex: none; height: clamp(230px, 40vh, 380px); overflow: hidden; touch-action: none; }
.arena canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; left: 0; right: 0; top: 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none; padding-inline: 16px; }
.mname { font-family: var(--font-display); font-size: 18px; text-shadow: 0 2px 0 rgba(0,0,0,.45); text-align: center; }
.mname.boss { color: #ffb4b9; }
.mname.golden { color: var(--gold); }
.bar { width: min(78%, 330px); height: 14px; border-radius: 999px; background: rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.15); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#ff7a83, var(--hp)); border-radius: 999px; transition: width .08s linear; }
.bar > span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; font-weight: 800; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.bar.timer { height: 8px; width: min(60%, 240px); }
.bar.timer > i { background: linear-gradient(#fff0b3, var(--gold)); transition: none; }
.progress { font-size: 12px; font-weight: 800; color: var(--muted); text-shadow: 0 1px 2px #000; }
.boss-btn { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 10px; border: 0; border-radius: 12px; padding: 8px 12px; background: linear-gradient(#ff7a83, #c3323d); font-family: var(--font-display); font-size: 15px; box-shadow: 0 3px 0 #7a1a22; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.combo { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 10px; width: 110px; pointer-events: none; }
.combo b { font-family: var(--font-display); font-size: 15px; display: block; text-shadow: 0 2px 0 rgba(0,0,0,.5); }
.combo .bar { width: 100%; height: 7px; border-width: 1px; }
.combo .bar > i { background: linear-gradient(90deg, var(--violet), #ff8ad8); }
.combo.frenzy b { color: #ff8ad8; animation: pulse .4s infinite; }
.buffs { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 64px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.buff { font-size: 11px; font-weight: 800; background: rgba(0,0,0,.45); border-radius: 8px; padding: 2px 7px; border-left: 3px solid var(--gold); font-variant-numeric: tabular-nums; }
.float { position: absolute; pointer-events: none; font-family: var(--font-display); font-size: 20px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.6); animation: rise .8s ease-out forwards; white-space: nowrap; transform: translate(-50%, -50%); }
.float.crit { color: #ffd35a; font-size: 28px; }
.float.dps { color: #b6f0c8; font-size: 15px; }
.float.pet { color: #d6b8ff; font-size: 17px; }
.float.gold { color: var(--gold); font-size: 17px; }
@keyframes rise { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -60px; } }
.chest { position: absolute; left: 0; top: 0; width: 54px; height: 54px; border: 0; padding: 0; background: none; z-index: 3; }
.chest canvas { position: static; width: 54px; height: 54px; }

/* Habilidades */
.skills { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; padding-block: 8px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); background: var(--panel); border-block: 1px solid var(--line); }
.sk { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 2px solid var(--line); background: var(--panel-2); display: grid; place-items: center; overflow: hidden; padding: 0; }
.sk .g { font-size: 22px; line-height: 1; z-index: 1; }
.sk .cdv { position: absolute; inset: 0; background: conic-gradient(rgba(5,8,18,.72) calc(var(--p, 0) * 1turn), transparent 0); }
.sk .t { position: absolute; bottom: 2px; left: 0; right: 0; font-size: 10px; font-weight: 800; z-index: 1; text-align: center; font-variant-numeric: tabular-nums; }
.sk.ready { border-color: var(--gold); box-shadow: 0 0 10px rgba(244,182,63,.35); }
.sk.active { border-color: var(--good); box-shadow: 0 0 14px rgba(92,201,141,.6); }
.sk.locked { opacity: .45; }

/* Panel y pestañas */
.panel { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-block: 10px 16px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; }
.tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { border: 0; background: none; padding: 9px 2px 8px; font-size: 11px; font-weight: 800; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
.tab .ti { font-size: 18px; line-height: 1.1; }
.tab.on { color: var(--text); }
.tab.on::before { content: ""; position: absolute; top: 0; left: 25%; right: 25%; height: 3px; border-radius: 0 0 3px 3px; background: var(--gold); }
.dot { position: absolute; top: 6px; right: calc(50% - 20px); width: 9px; height: 9px; border-radius: 50%; background: var(--hp); box-shadow: 0 0 0 2px var(--panel); }

h2 { font-family: var(--font-display); font-weight: 400; font-size: 18px; margin: 6px 0 0; letter-spacing: .3px; text-wrap: balance; }
h2 small { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 700; margin-left: 6px; }
.row { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 9px 10px; min-width: 0; }
.row.dim { opacity: .55; }
.av { width: 42px; height: 42px; border-radius: 12px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; color: #10172a; }
.info { flex: 1; min-width: 0; }
.info b { display: block; font-size: 14px; }
.info .sub { font-size: 12px; color: var(--muted); line-height: 1.35; }
.info .sub em { font-style: normal; color: var(--text); font-weight: 700; }
.btn { border: 0; border-radius: 11px; padding: 7px 10px; min-width: 78px; background: linear-gradient(#ffd067, var(--gold)); color: #3a2300; font-weight: 800; font-size: 12px; box-shadow: 0 3px 0 #a86f12; display: flex; flex-direction: column; align-items: center; line-height: 1.15; font-variant-numeric: tabular-nums; flex: none; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #a86f12; }
.btn[disabled] { filter: grayscale(.85) brightness(.7); cursor: default; }
.btn.gem { background: linear-gradient(#a9ecf8, var(--gem)); color: #062b36; box-shadow: 0 3px 0 #2a8fb0; }
.btn.green { background: linear-gradient(#8ae3b0, var(--good)); color: #06301a; box-shadow: 0 3px 0 #2c8a57; }
.btn.red { background: linear-gradient(#ff8f96, var(--hp)); color: #3a0508; box-shadow: 0 3px 0 #92222b; }
.btn small { font-size: 10px; font-weight: 700; opacity: .85; }
.seg { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 3px; align-self: flex-start; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 5px 11px; font-weight: 800; font-size: 12px; color: var(--muted); }
.seg button.on { background: var(--panel-2); color: var(--text); }
.pbar { height: 7px; border-radius: 999px; background: var(--bg); overflow: hidden; margin-top: 5px; }
.pbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gem), var(--good)); border-radius: 999px; }
.story { background: linear-gradient(160deg, #2a2050, var(--panel)); border: 1px solid #4a3d82; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.story .ch { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--violet); }
.story .tt { font-family: var(--font-display); font-size: 19px; }
.story p { margin: 0; color: #cfc6ee; font-size: 13px; line-height: 1.45; }
.flexrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 0; }
.wheel-wrap { position: relative; width: min(260px, 70vw); aspect-ratio: 1; margin: 6px auto 0; max-width: 100%; }
.wheel-wrap canvas { width: 100%; height: 100%; display: block; transition: transform 3.6s cubic-bezier(.12,.75,.15,1); }
.wheel-wrap::after { content: ""; position: absolute; top: -6px; left: 50%; transform: translateX(-50%); border: 12px solid transparent; border-top: 20px solid var(--text); border-bottom: 0; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
select { font: inherit; font-weight: 700; font-size: 13px; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; max-width: 100%; }

/* Avisos y ventanas */
.toasts { position: absolute; top: 52px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 20; padding-inline: 16px; }
.toast { background: rgba(16,23,42,.94); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; font-weight: 800; font-size: 13px; animation: tin .25s ease-out; max-width: 100%; text-align: center; }
.toast.gold { border-color: var(--gold); } .toast.gem { border-color: var(--gem); } .toast.violet { border-color: var(--violet); }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
.modal { position: absolute; inset: 0; background: rgba(5,8,18,.72); display: grid; place-items: center; z-index: 30; padding: 16px; }
.card { width: min(100%, 380px); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.5); max-height: 100%; overflow-y: auto; }
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; text-wrap: balance; }
.card p { margin: 0; color: #cdd4e8; line-height: 1.5; }
.card .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.card .btn { min-width: 110px; padding: 10px 14px; font-size: 14px; }
.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pick { border: 2px solid var(--line); background: var(--panel-2); border-radius: 14px; aspect-ratio: 1; display: grid; place-items: center; padding: 4px; font-size: 12px; font-weight: 800; }
.pick canvas { width: 70%; height: auto; }
.pick.won { border-color: var(--gold); background: #3a3020; }
@media (prefers-reduced-motion: reduce) { .boss-btn, .combo.frenzy b { animation: none; } .wheel-wrap canvas { transition-duration: .6s; } }
</style>

<div id="app">
  <div class="top">
    <div class="res" title="Oro"><span class="coin"></span><span id="goldTxt">0</span></div>
    <div class="res" title="Gemas"><span class="gemi"></span><span id="gemTxt">0</span></div>
    <div class="stage-chip" id="stageTxt">Etapa 1</div>
    <button class="icon-btn" id="menuBtn" aria-label="Ajustes">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
  <div class="arena" id="arena">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="mname" id="mName">…</div>
      <div class="bar" id="hpBar"><i id="hpFill"></i><span id="hpTxt"></span></div>
      <div class="bar timer" id="timerBar" hidden><i id="timerFill"></i></div>
      <div class="progress" id="progTxt"></div>
    </div>
    <div class="buffs" id="buffs"></div>

  <div class="skills" id="skills"></div>
  <div class="panel" id="panel"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="toasts" id="toasts"></div>
  <div class="modal" id="modal" hidden><div class="card" id="modalCard"></div></div>
</div>

// ───────────────────────── Fórmulas ─────────────────────────
const R = id => S.relics[id] || 0;
const hpOf = s => Math.ceil(10 * Math.pow(1.48, s - 1) * (1 + s * 0.05));
const goldOf = s => Math.ceil(hpOf(s) * 0.1 + 2 + s);
const heroTap = l => l * Math.pow(1.045, l);
const HERO_BASE = 5, HERO_RATE = 1.074, COMP_RATE = 1.075;
const milestone = l => Math.pow(2, Math.floor(l / 25)) * (l >= 100 ? 2 : 1);
const compRaw = (i, l) => COMPS[i].dps * l * milestone(l);
const now = () => Date.now();
const buff = k => (S.buffs[k] || 0) > now();
const away = i => S.exp.some(e => e && e.c === i);
const achCount = () => Object.values(S.ach).reduce((a, b) => a + b, 0);
function dmgMult() {
  let m = (1 + 0.3 * R('espada')) * (1 + 0.02 * achCount());
  if (buff('bendicion')) m *= 2;
  return m;
}
function compDps(i) { return compRaw(i, S.comps[i]) * (1 + 0.4 * R('cuerno')) * dmgMult() * (buff('grito') ? 2.5 : 1); }
function totalDps() { let t = 0; for (let i = 0; i < COMPS.length; i++) if (!away(i)) t += compDps(i); return t; }
function rawDps() { let t = 0; for (let i = 0; i < COMPS.length; i++) if (!away(i)) t += compRaw(i, S.comps[i]); return t; }
function tapDamage() {
  let t = (heroTap(S.hero) + rawDps() * 0.01) * dmgMult();
  if (buff('furia')) t *= 3;
  if (G.frenzyEnd > now()) t *= 2;
  t *= 1 + G.combo * 0.005;
  return t;
}
function critChance() { return 0.03 + 0.01 * R('halcon') + (buff('ojo') ? 0.35 : 0) + (G.frenzyEnd > now() ? 0.15 : 0); }
function critMult() { return 4 * (1 + 0.2 * R('halcon')); }
function goldMult() { return (1 + 0.25 * R('bolsa')) * (buff('oro') ? 3 : 1); }
function costN(base, rate, lvl, n) { return base * Math.pow(rate, lvl) * (Math.pow(rate, n) - 1) / (rate - 1); }
function maxN(base, rate, lvl, gold) {
  const n = Math.floor(Math.log(gold * (rate - 1) / (base * Math.pow(rate, lvl)) + 1) / Math.log(rate));
  return Math.max(0, Math.min(n, 2000));
}
function buyCount(base, rate, lvl) { return S.buyN === 0 ? Math.max(1, maxN(base, rate, lvl, S.gold)) : S.buyN; }
function skillCd(sk) { return sk.cd * (1 - 0.05 * R('runa')); }
function bossTime() { return 30 + 2 * R('reloj'); }
function essenceGain() { return S.stage < 25 ? 0 : Math.floor(Math.pow(S.stage - 20, 1.35)) + Math.floor(st('maxStage') / 10); }
const relicCost = (r, l) => Math.ceil(r.base * Math.pow(r.rate, l));
const petCost = () => (S.pet === 0 ? 40 : 8 + S.pet * 4);
const petDmgMult = () => 0.6 + 0.15 * S.pet;
const spinFree = () => now() - S.lastSpin >= 4 * 3600e3;

// ───────────────────────── Utilidades ─────────────────────────
const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];
function fmt(n) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 10 && n % 1 ? n.toFixed(1) : String(Math.floor(n));
  const e = Math.floor(Math.log10(n) / 3);
  let s;
  if (e < SUF.length) s = SUF[e];
  else { const k = e - SUF.length; s = String.fromCharCode(97 + Math.floor(k / 26) % 26) + String.fromCharCode(97 + k % 26); }
  const v = n / Math.pow(1000, e);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v)) + s;
}
function fmtT(sec) {
  sec = Math.max(0, Math.ceil(sec));
  if (sec >= 3600) return Math.floor(sec / 3600) + ' h ' + Math.floor(sec % 3600 / 60) + ' min';
  if (sec >= 60) return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  return sec + ' s';
}
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function rng(seed) { let x = seed | 0 || 1; return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return ((x >>> 0) % 100000) / 100000; }; }
const zoneOf = s => ZONES[Math.floor((s - 1) / 10) % ZONES.length];
function stat(k, n = 1) {

}
function toast(msg, cls = '') {

  el.className = 'toast ' + cls; el.innerHTML = msg;

}

let AC = null;
function beep(f = 520, d = 0.05, type = 'square', vol = 0.04) {
  if (!S.sound) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) { /* sin audio */ }
}

function spawn() {

  const r = rng(seed);

  let hp = hpOf(S.stage) * (boss ? 7 : 1) * (golden ? 3 : 1);
  const name = boss ? BOSS_NAMES[(S.stage / 5 | 0) % BOSS_NAMES.length]

  G.m = {

function applyDamage(d) {
  const m = G.m;
  if (!m || m.dying) return;
  m.hp -= d;
  if (m.hp <= 0) { m.hp = 0; kill(); }
}

function kill() {
  const m = G.m;
  m.dying = performance.now();
  let g = goldOf(S.stage) * (m.boss ? 6 : 1) * (m.golden ? 10 : 1) * goldMult();
  S.gold += g;
  stat('goldEarned', g);
  stat('kills');
  if (m.golden) { stat('golden'); toast(`¡Monstruo dorado! +${fmt(g)} ${COIN}`, 'gold'); }
  floatText('+' + fmt(g), G.w / 2, G.h * 0.62, 'gold');
  for (let i = 0; i < 18; i++) G.parts.push(part(G.w / 2, G.h * 0.58, m.golden ? 45 : m.hue, 1));
  beep(m.boss ? 220 : 330, 0.12, 'triangle', 0.05);
  let chestAfter = false;
  if (m.boss) {
    stat('bosses');
    const beaten = S.stage;
    S.stage++; S.kills = 0; S.farm = false;
    if (S.stage > st('maxStage')) S.stats.maxStage = S.stage;
    toast(`¡Jefe vencido! Etapa ${S.stage}`, 'gold');
    if (beaten % 5 === 0) chestAfter = true;
    if ((S.stage - 1) % 10 === 0) toast(`Nueva zona: ${zoneOf(S.stage).name}`, 'violet');
  } else if (!S.farm) {
    S.kills = Math.min(10, S.kills + 1);
  }
  setTimeout(() => { spawn(); if (chestAfter) mysteryChest(); }, 260);
}

function part(x, y, hue, big) {
  const a = Math.random() * Math.PI * 2, v = (big ? 120 : 60) + Math.random() * 160;
  return { x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0.6 + Math.random() * 0.4, t: 0, hue, s: 2 + Math.random() * (big ? 5 : 3) };
}

function floatText(txt, x, y, cls = '') {

  const el = document.createElement('div');
  el.className = 'float ' + cls; el.textContent = txt;
  el.style.left = x + 'px'; el.style.top = y + 'px';

}

function doTap(x, y, auto) {
  const m = G.m;
  if (!m || m.dying) return;
  const t = now();
  if (!auto) {
    if (t - G.lastTap < 700) G.combo = Math.min(100, G.combo + 1); else G.combo = Math.max(0, G.combo - 10);
    G.lastTap = t;
    if (G.combo >= 100 && G.frenzyEnd < t) {
      G.frenzyEnd = t + 6000; G.combo = 0; stat('frenzies');
      toast('¡FRENESÍ! Daño ×2 durante 6 s', 'violet'); beep(880, 0.2, 'sawtooth', 0.04);
    }
    stat('taps');
  }
  let d = tapDamage();
  const crit = Math.random() < critChance();
  if (crit) { d *= critMult(); stat('crits'); G.shake = 0.25; }
  applyDamage(d);
  m.flash = 1; G.bump = 1;
  G.slashes.push({ x, y, a: Math.random() * Math.PI, t: 0 });
  for (let i = 0; i < (crit ? 8 : 3); i++) G.parts.push(part(x, y, crit ? 48 : 200, 0));
  floatText(fmt(d), x + (Math.random() - 0.5) * 30, y - 10, crit ? 'crit' : '');
  if (!auto) beep(crit ? 760 : 420 + Math.random() * 80, 0.04);

function useSkill(sk) {

  stat('skills');
  beep(660, 0.15, 'triangle', 0.05);

    for (let i = 0; i < 30; i++) G.parts.push(part(G.w / 2, G.h * 0.5, 55, 1));
  } else {

  }
  renderSkills();
}

  const c = costN(HERO_BASE, HERO_RATE, S.hero, n);
  if (S.gold < c) return;
  const before = S.hero;
  S.gold -= c; S.hero += n; stat('heroLevels', n);

  renderSkills();
}
function buyComp(i) {
  const c0 = COMPS[i].cost;
  const n = buyCount(c0, COMP_RATE, S.comps[i]);
  const c = costN(c0, COMP_RATE, S.comps[i], n);
  if (S.gold < c) return;
  const before = S.comps[i];
  S.gold -= c; S.comps[i] += n; stat('compLevels', n);

      else if (p.k === 'gems') S.gems += p.v;
      else S.buffs.bendicion = Math.max(S.buffs.bendicion || 0, now()) + p.v * 1000;
      stat('pchests');

      card.insertAdjacentHTML('beforeend', '<div class="btns"><button class="btn" data-close>Seguir luchando</button></div>');
      beep(880, 0.15, 'triangle', 0.05);
    });

}

function spin() {
  if (G.spinning) return;
  const free = spinFree();
  if (!free && S.gems < 20) { toast('Necesitas 20 gemas para girar', 'gem'); return; }
  if (free) S.lastSpin = now(); else S.gems -= 20;
  const total = WHEEL.reduce((a, s) => a + s.w, 0);
  let r = Math.random() * total, idx = 0;
  while (r >= WHEEL[idx].w) { r -= WHEEL[idx].w; idx++; }
  G.spinning = true;
  const seg = 360 / WHEEL.length;
  G.wheelRot = (G.wheelRot || 0) + 360 * 5 + (360 - ((G.wheelRot || 0) % 360)) - (idx + 0.5) * seg + (Math.random() - 0.5) * seg * 0.6;
  const cv = document.querySelector('#wheelCv');
  if (cv) cv.style.transform = `rotate(${G.wheelRot}deg)`;
  setTimeout(() => { G.spinning = false; wheelPrize(idx); }, cv ? 3700 : 50);
}
function wheelPrize(i) {
  stat('spins');
  const w = WHEEL[i];
  if (i === 0 || i === 3) { const g = killGold() * (i === 0 ? 30 : 100); S.gold += g; stat('goldEarned', g); toast(`Rueda: +${fmt(g)} ${COIN}`, 'gold'); }
  else if (i === 1 || i === 4 || i === 7) { const n = i === 1 ? 5 : i === 4 ? 15 : 50; S.gems += n; toast(`Rueda: +${n} ${GEM}`, 'gem'); }
  else if (i === 2) { S.buffs.bendicion = Math.max(S.buffs.bendicion || 0, now()) + 60000; toast('Rueda: daño ×2 durante 60 s', 'violet'); }
  else if (i === 5) { S.cd = {}; toast('Rueda: ¡habilidades recargadas!', 'violet'); renderSkills(); }
  else if (i === 6) { if (!G.chest) spawnFlyingChest(); toast('Rueda: ¡un cofre alado apareció!', 'violet'); }
  beep(w.w < 5 ? 1200 : 780, 0.2, 'triangle', 0.05);
}

function sendExp(slot, d) {
  const sel = G.expSel[slot];
  if (sel == null || S.comps[sel] === 0 || away(sel)) return;
  S.exp[slot] = { c: sel, d, end: now() + EXP_DUR[d].s * 1000, gold: compRaw(sel, S.comps[sel]) * EXP_DUR[d].s * 0.14 * goldMult() + killGold() * 5 };
  G.expSel[slot] = null;
  toast(`${COMPS[sel].name} partió de expedición (${EXP_DUR[d].l})`, 'violet');
}
function claimExp(slot) {
  const e = S.exp[slot]; if (!e || e.end > now()) return;
  const lucky = Math.random() < 0.2;
  const g = e.gold * (lucky ? 2 : 1), gem = EXP_DUR[e.d].gem * (lucky ? 2 : 1);
  S.gold += g; S.gems += gem; stat('goldEarned', g); stat('expeditions');
  S.exp[slot] = null;
  toast(`${COMPS[e.c].name} volvió${lucky ? ' ¡con un tesoro doble!' : ''}: +${fmt(g)} ${COIN} +${gem} ${GEM}`, 'gold');
}

// ───────────────────────── Misiones ─────────────────────────
function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function ensureDaily() {
  if (S.daily && S.daily.day === today()) return;
  const pool = DAILY_POOL.slice(); const list = [];
  while (list.length < 4) list.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);
  S.daily = { day: today(), bonus: false, list: list.map(q => ({ k: q.k, n: q.n, t: q.t, base: st(q.k), done: false })) };
}
const dailyProg = q => Math.min(q.n, st(q.k) - q.base);
function claimDaily(i) {
  const q = S.daily.list[i]; if (q.done || dailyProg(q) < q.n) return;
  q.done = true; S.gems += 15; toast(`Misión diaria completada: +15 ${GEM}`, 'gem');
  if (S.daily.list.every(x => x.done) && !S.daily.bonus) { S.daily.bonus = true; S.gems += 40; toast(`¡Todas las diarias! +40 ${GEM}`, 'gem'); }
}
function claimChapter() {
  const c = chapter(S.chapter); const [a, b] = c.p();
  if (a < b) return;
  const g = killGold() * c.r.gold;
  S.gems += c.r.gems; S.gold += g;
  toast(`Capítulo «${c.t}» completado: +${c.r.gems} ${GEM}${g ? ` +${fmt(g)} ${COIN}` : ''}`, 'gem');
  S.chapter++;
  beep(990, 0.25, 'triangle', 0.05);
}
function claimAch(k) {
  const a = ACH.find(x => x.k === k); const tier = S.ach[k] || 0;
  if (tier >= a.tiers.length || st(k) < a.tiers[tier]) return;
  S.ach[k] = tier + 1; const g = 5 * (tier + 1) * (tier + 1);
  S.gems += g; toast(`Logro «${a.name}» ${'I'.repeat(tier + 1)}: +${g} ${GEM} y +2 % daño`, 'gem');
}
function pendingMissions() {
  let n = 0;
  ensureDaily();
  S.daily.list.forEach(q => { if (!q.done && dailyProg(q) >= q.n) n++; });
  const [a, b] = chapter(S.chapter).p(); if (a >= b) n++;
  ACH.forEach(x => { const t = S.ach[x.k] || 0; if (t < x.tiers.length && st(x.k) >= x.tiers[t]) n++; });
  return n;
}

function prestige() {

  S.essences += e; stat('prestiges');
  Object.assign(S, { gold: 0, stage: 1 + 2 * R('corona'), kills: 0, farm: false, hero: 1, comps: COMPS.map(() => 0), cd: {}, buffs: {}, exp: [null, null, null] });
  G.combo = 0; G.frenzyEnd = 0;

}
function buyRelic(id) {
  const r = RELICS.find(x => x.id === id), l = R(id);

  const c = relicCost(r, l); if (S.essences < c) return;

function offlineCheck() {

    h += `<div class="row"><div class="av" style="background:${r.color}">${l}</div><div class="info"><b>${r.name}</b><div class="sub">${l ? r.desc(l) : 'Sin despertar'}${maxed ? '' : `<br>Siguiente: ${r.desc(l + 1)}`}</div></div>
    <button class="btn" data-act="relic" data-id="${r.id}" ${maxed || S.essences < c ? 'disabled' : ''}>${maxed ? 'Máximo' : 'Mejorar'}${maxed ? '' : `<small>${c} esencia${c > 1 ? 's' : ''}</small>`}</button></div>`;
  });
  return h;
}
const PANELS = { heroe: panelHeroe, aliados: panelAliados, misiones: panelMisiones, aventuras: panelAventuras, reliquias: panelReliquias };
G.expSel = [null, null, null];
function renderPanel(force) {
  const panel = $('panel');
  if (G.spinning && S.tab === 'aventuras') return;
  if (!force && (G.panelDown || (document.activeElement && document.activeElement.tagName === 'SELECT'))) return;
  const html = PANELS[S.tab]();
  if (html === G.lastHtml && !force) return;
  panel.innerHTML = html; G.lastHtml = html;
  if (S.tab === 'aventuras') drawWheel();
}
function drawWheel() {
  const cv = $('wheelCv'); if (!cv) return;
  const c = cv.getContext('2d'), R0 = 250, cx = 260, seg = Math.PI * 2 / WHEEL.length;
  c.clearRect(0, 0, 520, 520);
  WHEEL.forEach((w, i) => {
    const a0 = -Math.PI / 2 + i * seg;
    c.beginPath(); c.moveTo(cx, cx); c.arc(cx, cx, R0, a0, a0 + seg); c.closePath();
    c.fillStyle = w.c; c.globalAlpha = i % 2 ? 0.85 : 1; c.fill(); c.globalAlpha = 1;
    c.strokeStyle = '#10172a'; c.lineWidth = 4; c.stroke();
    c.save(); c.translate(cx, cx); c.rotate(a0 + seg / 2);
    c.fillStyle = '#10172a'; c.font = '800 30px Nunito, sans-serif'; c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillText(w.l, R0 - 18, 0); c.restore();
  });
  c.beginPath(); c.arc(cx, cx, 34, 0, Math.PI * 2); c.fillStyle = '#10172a'; c.fill();
  c.beginPath(); c.arc(cx, cx, 22, 0, Math.PI * 2); c.fillStyle = '#f4b63f'; c.fill();
  cv.style.transition = 'none'; cv.style.transform = `rotate(${G.wheelRot || 0}deg)`;
  cv.offsetWidth; cv.style.transition = '';
}
function chestCanvas(wings) {
  const cv = document.createElement('canvas'); cv.width = 108; cv.height = 108;
  const c = cv.getContext('2d');
  if (wings) {
    c.fillStyle = '#b38cff';
    [[-1, 22], [1, 86]].forEach(([d, x]) => { c.beginPath(); c.moveTo(x, 50); c.quadraticCurveTo(x + d * 26, 14, x + d * 20, 64); c.quadraticCurveTo(x + d * 10, 54, x, 62); c.fill(); });
  }
  c.fillStyle = '#8a4b1f'; c.fillRect(24, 46, 60, 40);
  c.fillStyle = '#a65d27'; c.beginPath(); c.moveTo(24, 50); c.quadraticCurveTo(54, 20, 84, 50); c.fill();
  c.fillStyle = '#f4b63f'; c.fillRect(24, 48, 60, 6); c.fillRect(50, 44, 8, 42); c.fillRect(24, 80, 60, 6);
  c.fillStyle = '#fff3c4'; c.fillRect(51, 58, 6, 8);
  return cv;
}

function updateHud(force) {
  const m = G.m;
  $('goldTxt').textContent = fmt(S.gold);
  $('gemTxt').textContent = fmt(S.gems);
  $('stageTxt').textContent = 'Etapa ' + S.stage;
  if (!m) return;
  const nm = $('mName');
  nm.textContent = m.name; nm.className = 'mname' + (m.boss ? ' boss' : m.golden ? ' golden' : '');
  $('hpFill').style.width = (m.hp / m.max * 100) + '%';
  $('hpTxt').textContent = fmt(Math.ceil(m.hp)) + ' / ' + fmt(m.max);
  const tb = $('timerBar');
  if (m.boss) { tb.hidden = false; $('timerFill').style.width = Math.max(0, (G.deadline - now()) / (bossTime() * 1000) * 100) + '%'; }
  else tb.hidden = true;
  $('progTxt').textContent = zoneOf(S.stage).name + ' · ' + (m.boss ? `Jefe · ${Math.max(0, (G.deadline - now()) / 1000).toFixed(1)} s` : S.farm ? 'Entrenando' : `${S.kills}/10 monstruos`);
  $('bossBtn').hidden = !(S.farm && !m.boss);
  const fz = G.frenzyEnd > now();
  $('combo').className = 'combo' + (fz ? ' frenzy' : '');
  $('comboTxt').textContent = fz ? `FRENESÍ ${((G.frenzyEnd - now()) / 1000).toFixed(1)} s` : `Combo ${Math.floor(G.combo)}`;
  $('comboFill').style.width = (fz ? (G.frenzyEnd - now()) / 60 : G.combo) + '%';
  const names = { furia: 'Furia ×3', oro: 'Oro ×3', tormenta: 'Tormenta', grito: 'Aliados ×2,5', ojo: 'Crítico +35 %', bendicion: 'Bendición ×2' };
  const bh = Object.keys(names).filter(buff).map(k => `<div class="buff">${names[k]} · ${Math.ceil((S.buffs[k] - now()) / 1000)} s</div>`).join('');
  if (bh !== G.buffHtml) { $('buffs').innerHTML = bh; G.buffHtml = bh; }
}

// ───────────────────────── Dibujo ─────────────────────────
function resize() {
  const a = $('arena'), cv = $('cv');
  G.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  G.w = a.clientWidth; G.h = a.clientHeight;
  cv.width = G.w * G.dpr; cv.height = G.h * G.dpr;
}
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;
function draw(time, dt) {
  const c = $('cv').getContext('2d'), W = G.w, H = G.h, z = zoneOf(S.stage);
  c.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  let sx = 0, sy = 0;
  if (G.shake > 0) { sx = (Math.random() - 0.5) * 10 * G.shake; sy = (Math.random() - 0.5) * 10 * G.shake; G.shake -= dt; }
  c.save(); c.translate(sx, sy);
  // cielo
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, z.sky[0]); g.addColorStop(1, z.sky[1]);
  c.fillStyle = g; c.fillRect(-10, -10, W + 20, H + 20);
  // estrellas / luciérnagas
  const r = rng(S.stage * 977 + 3);
  for (let i = 0; i < 26; i++) {
    const x = r() * W, y = r() * H * 0.7, tw = 0.4 + 0.6 * Math.abs(Math.sin(time * (0.5 + r()) + i));
    c.fillStyle = hsl(z.hue + 40, 80, 80, 0.35 * tw); c.beginPath(); c.arc(x, y, 1 + r() * 1.6, 0, 7); c.fill();
  }
  // colinas
  c.fillStyle = hsl(z.hue, 30, 14, 0.8);
  c.beginPath(); c.moveTo(0, H * 0.72);
  for (let x = 0; x <= W; x += 20) c.lineTo(x, H * 0.7 - Math.sin(x * 0.012 + S.stage) * 18 - Math.sin(x * 0.03) * 6);
  c.lineTo(W, H); c.lineTo(0, H); c.fill();
  c.fillStyle = z.ground; c.globalAlpha = 0.55;
  c.beginPath(); c.ellipse(W / 2, H * 0.86, W * 0.75, H * 0.16, 0, 0, 7); c.fill(); c.globalAlpha = 1;
  // monstruo
  if (G.m) drawMonster(c, G.m, W / 2, H * 0.6, Math.min(W, H) * (G.m.boss ? 0.26 : 0.2), time, dt);
  // mascota
  if (S.pet) drawPet(c, W * 0.17, H * 0.5 + Math.sin(time * 3) * 6, time);
  // tajos
  G.slashes = G.slashes.filter(s => (s.t += dt) < 0.18);
  G.slashes.forEach(s => {
    const k = s.t / 0.18, L = 34;
    c.strokeStyle = `rgba(255,255,255,${1 - k})`; c.lineWidth = 4 * (1 - k) + 1; c.lineCap = 'round';
    c.beginPath(); c.moveTo(s.x - Math.cos(s.a) * L, s.y - Math.sin(s.a) * L); c.lineTo(s.x + Math.cos(s.a) * L, s.y + Math.sin(s.a) * L); c.stroke();
  });
  // partículas
  G.parts = G.parts.filter(p => (p.t += dt) < p.life);
  if (G.parts.length > 220) G.parts.splice(0, G.parts.length - 220);
  G.parts.forEach(p => {
    p.vy += 420 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    c.fillStyle = hsl(p.hue, 90, 65, 1 - p.t / p.life);
    c.beginPath(); c.arc(p.x, p.y, p.s, 0, 7); c.fill();
  });
  c.restore();
}
function drawMonster(c, m, cx, cy, R0, time, dt) {
  let scale = 1;
  const age = (performance.now() - m.born) / 1000;
  if (age < 0.25) scale = 0.4 + 0.6 * (age / 0.25);
  if (m.dying) { const k = (performance.now() - m.dying) / 250; scale *= Math.max(0, 1 - k); }
  if (scale <= 0) return;
  G.bump = Math.max(0, G.bump - dt * 6);
  const squash = 1 + G.bump * 0.08;
  const bob = Math.sin(time * 2.2) * 4;
  c.save(); c.translate(cx, cy + bob); c.scale(scale * squash, scale / squash);
  // sombra
  c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(0, R0 * 0.95 - bob, R0 * 0.8, R0 * 0.16, 0, 0, 7); c.fill();
  if (m.boss) { c.fillStyle = hsl(m.hue, 90, 60, 0.18 + 0.08 * Math.sin(time * 4)); c.beginPath(); c.arc(0, 0, R0 * 1.35, 0, 7); c.fill(); }
  // cuernos
  if (m.horns) {
    c.fillStyle = hsl(m.hue + 30, 25, 85);
    [-1, 1].forEach(d => { c.beginPath(); c.moveTo(d * R0 * 0.35, -R0 * 0.7); c.quadraticCurveTo(d * R0 * 0.85, -R0 * 1.25, d * R0 * 0.75, -R0 * 1.3); c.lineTo(d * R0 * 0.6, -R0 * 0.6); c.fill(); });
  }
  // cuerpo
  const gr = c.createRadialGradient(-R0 * 0.3, -R0 * 0.35, R0 * 0.1, 0, 0, R0 * 1.1);
  gr.addColorStop(0, hsl(m.hue, m.golden ? 95 : 65, m.golden ? 75 : 62)); gr.addColorStop(1, hsl(m.hue, m.golden ? 80 : 55, m.golden ? 38 : 28));
  const body = new Path2D();
  for (let i = 0; i <= 64; i++) {
    const a = i / 64 * Math.PI * 2;
    const rr = R0 * (1 + 0.07 * Math.sin(a * m.lobes + time * 2) + (m.spikes ? 0.12 * Math.max(0, Math.sin(a * 9)) ** 6 : 0));
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr * m.squish;
    i ? body.lineTo(x, y) : body.moveTo(x, y);
  }
  body.closePath(); c.fillStyle = gr; c.fill(body);
  c.lineWidth = 3; c.strokeStyle = 'rgba(0,0,0,.25)'; c.stroke(body);
  // ojos
  const blink = (Math.sin(time * 1.3 + m.seed) > 0.985);
  for (let i = 0; i < m.eyes; i++) {
    const ex = (i - (m.eyes - 1) / 2) * R0 * 0.42, ey = -R0 * 0.18 - (m.eyes === 3 && i === 1 ? R0 * 0.16 : 0), er = R0 * (m.eyes === 1 ? 0.26 : 0.17);
    c.fillStyle = '#fff'; c.beginPath(); c.ellipse(ex, ey, er, blink ? er * 0.1 : er, 0, 0, 7); c.fill();
    if (!blink) { c.fillStyle = '#141018'; c.beginPath(); c.arc(ex + Math.sin(time) * er * 0.25, ey + er * 0.15, er * 0.48, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(ex + er * 0.05, ey - er * 0.1, er * 0.15, 0, 7); c.fill(); }
  }
  // boca
  c.fillStyle = '#2a0f18'; c.beginPath(); c.ellipse(0, R0 * 0.35, R0 * 0.38, R0 * (0.14 + G.bump * 0.12), 0, 0, Math.PI); c.fill();
  if (m.teeth) { c.fillStyle = '#fff'; for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * R0 * 0.13 - R0 * 0.05, R0 * 0.35); c.lineTo(i * R0 * 0.13 + R0 * 0.05, R0 * 0.35); c.lineTo(i * R0 * 0.13, R0 * 0.45); c.fill(); } }
  // corona de jefe
  if (m.boss) {
    c.fillStyle = '#f4b63f'; c.beginPath(); c.moveTo(-R0 * 0.4, -R0 * 0.8);
    [-0.4, -0.25, -0.13, 0, 0.13, 0.25, 0.4].forEach((x, i) => c.lineTo(x * R0, -R0 * (i % 2 ? 1.25 : 0.95) - (i === 3 ? R0 * 0.1 : 0)));
    c.lineTo(R0 * 0.4, -R0 * 0.8); c.closePath(); c.fill();
  }
  if (m.golden && Math.random() < 0.3) G.parts.push({ x: cx + (Math.random() - 0.5) * R0 * 2, y: cy + (Math.random() - 0.5) * R0 * 2, vx: 0, vy: -40, life: 0.6, t: 0, hue: 50, s: 2 });
  // destello de golpe
  if (m.flash > 0) { c.fillStyle = `rgba(255,255,255,${m.flash * 0.5})`; c.fill(body); m.flash = Math.max(0, m.flash - dt * 8); }
  c.restore();
}
function drawPet(c, x, y, time) {
  const flap = Math.sin(time * 12) * 0.5;
  c.save(); c.translate(x, y);
  c.fillStyle = '#9b6cf0';
  [-1, 1].forEach(d => { c.save(); c.scale(d, 1); c.rotate(-0.3 + flap * 0.5); c.beginPath(); c.moveTo(4, -4); c.quadraticCurveTo(26, -28, 30, -6); c.quadraticCurveTo(20, -8, 6, 4); c.fill(); c.restore(); });
  c.fillStyle = '#b38cff'; c.beginPath(); c.ellipse(0, 0, 15, 13, 0, 0, 7); c.fill();
  c.fillStyle = '#ffb36b'; c.beginPath(); c.ellipse(0, 5, 8, 6, 0, 0, 7); c.fill();
  c.fillStyle = '#fff'; c.beginPath(); c.arc(5, -3, 4.5, 0, 7); c.fill();
  c.fillStyle = '#141018'; c.beginPath(); c.arc(6, -3, 2.4, 0, 7); c.fill();
  c.fillStyle = '#e8d9ff'; c.beginPath(); c.moveTo(-6, -11); c.lineTo(-3, -18); c.lineTo(0, -12); c.fill();
  c.restore();
}

// ───────────────────────── Bucle ─────────────────────────
let lastT = performance.now(), uiT = 0, saveT = 0;
function update(dt) {
  const t = now(), m = G.m;
  if (m && !m.dying) {
    const d = totalDps() * dt;
    if (d > 0) { applyDamage(d); G.dpsAcc += d; }
    if (m.boss && t > G.deadline && !m.dying) {
      S.farm = true; S.kills = 10;
      toast('Se acabó el tiempo. Entrena y vuelve a desafiar al jefe.', '');
      spawn();
    }
  }
  G.dpsTick += dt;
  if (G.dpsTick >= 1) { if (G.dpsAcc > 0) floatText(fmt(G.dpsAcc), G.w * (0.62 + Math.random() * 0.2), G.h * 0.45, 'dps'); G.dpsAcc = 0; G.dpsTick = 0; }
  if (buff('tormenta')) {
    G.autoAcc += dt * 12;
    while (G.autoAcc >= 1) { G.autoAcc--; doTap(G.w / 2 + (Math.random() - 0.5) * G.w * 0.3, G.h * 0.6 + (Math.random() - 0.5) * G.h * 0.3, true); }
  }
  if (S.pet && G.m && !G.m.dying) {
    G.petT += dt;
    if (G.petT >= 1.2) { G.petT = 0; const d = tapDamage() * petDmgMult(); applyDamage(d); floatText(fmt(d), G.w * 0.3, G.h * 0.45, 'pet'); }
  }
  if (t - G.lastTap > 1500 && G.combo > 0) G.combo = Math.max(0, G.combo - dt * 25);
  // cofre alado
  if (!G.chest && t > G.nextChest) { spawnFlyingChest(); G.nextChest = t + 35000 + Math.random() * 40000; }
  if (G.chest) {
    const ch = G.chest; ch.t += dt; ch.x += ch.dir * 55 * dt;
    const y = ch.y + Math.sin(ch.t * 3 + ch.phase) * 14;
    ch.el.style.transform = `translate(${ch.x}px, ${y}px)`;
    if (ch.x < -80 || ch.x > G.w + 80) { ch.el.remove(); G.chest = null; }
  }
}
function loop(ts) {
  const dt = Math.min(0.1, (ts - lastT) / 1000); lastT = ts;
  update(dt); draw(ts / 1000, dt);
  uiT += dt; saveT += dt;
  if (uiT > 0.12) { updateHud(); }
  if (uiT > 0.3) { uiT = 0; renderSkills(); renderPanel(); renderTabs(); }
  if (saveT > 5) { saveT = 0; save(); }
  requestAnimationFrame(loop);
}

// ───────────────────────── Eventos ─────────────────────────
function bind() {
  const arena = $('arena');
  arena.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    const rc = arena.getBoundingClientRect();
    doTap(e.clientX - rc.left, e.clientY - rc.top, false);
  });
  $('bossBtn').addEventListener('click', () => { S.farm = false; S.kills = 10; spawn(); });
  $('skills').addEventListener('pointerdown', e => { const b = e.target.closest('[data-sk]'); if (b) { e.preventDefault(); useSkill(SKILLS.find(s => s.id === b.dataset.sk)); } });
  $('skills').addEventListener('keydown', e => { const b = e.target.closest('[data-sk]'); if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); useSkill(SKILLS.find(s => s.id === b.dataset.sk)); } });
  $('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; S.tab = b.dataset.tab; $('panel').scrollTop = 0; renderTabs(); renderPanel(true); });
  $('menuBtn').addEventListener('click', showMenu);
  const panel = $('panel');
  panel.addEventListener('pointerdown', () => { G.panelDown = true; });
  window.addEventListener('pointerup', () => { setTimeout(() => { G.panelDown = false; }, 30); });
  window.addEventListener('pointercancel', () => { G.panelDown = false; });
  panel.addEventListener('change', e => {
    const s = e.target.closest('[data-expsel]'); if (!s) return;
    G.expSel[+s.dataset.expsel] = s.value === '' ? null : +s.value; s.blur(); renderPanel(true);
  });
  panel.addEventListener('click', e => {
    const n = e.target.closest('[data-buyn]');
    if (n) { S.buyN = +n.dataset.buyn; renderPanel(true); return; }
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const a = b.dataset.act;
    if (a === 'hero') buyHero();
    else if (a === 'comp') buyComp(+b.dataset.i);
    else if (a === 'pet') { const c = petCost(); if (S.gems >= c) { S.gems -= c; S.pet++; toast(S.pet === 1 ? '¡Nació tu dragoncito!' : `Dragoncito nivel ${S.pet}`, 'violet'); } }
    else if (a === 'chapter') claimChapter();
    else if (a === 'daily') claimDaily(+b.dataset.i);
    else if (a === 'ach') claimAch(b.dataset.k);
    else if (a === 'spin') spin();
    else if (a === 'sendexp') sendExp(+b.dataset.i, +b.dataset.d);
    else if (a === 'claimexp') claimExp(+b.dataset.i);
    else if (a === 'shop-gold') { if (S.gems >= 10) { S.gems -= 10; const g = killGold() * 60; S.gold += g; toast(`+${fmt(g)} ${COIN}`, 'gold'); } }
    else if (a === 'shop-cd') { if (S.gems >= 15) { S.gems -= 15; S.cd = {}; renderSkills(); toast('Habilidades recargadas', 'violet'); } }
    else if (a === 'shop-bless') { if (S.gems >= 25) { S.gems -= 25; S.buffs.bendicion = Math.max(S.buffs.bendicion || 0, now()) + 120000; toast('Bendición: daño ×2 por 2 min', 'violet'); } }
    else if (a === 'relic') buyRelic(b.dataset.id);
    else if (a === 'prestige') openModal(`<h3>¿Renacer ahora?</h3><p>Ganarás <b>${essenceGain()} esencias</b>. Tu héroe, aliados, oro y etapa vuelven al inicio; conservas gemas, reliquias, logros y mascota.</p>
      <div class="btns"><button class="btn red" id="yesPrestige">Renacer</button><button class="btn green" data-close>Todavía no</button></div>`, c => { c.querySelector('#yesPrestige').onclick = prestige; });
    G.panelDown = false; renderPanel(true); updateHud();
  });
  new ResizeObserver(resize).observe(arena);
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
}

function start() {
  load();
  S.stats.maxStage = Math.max(st('maxStage'), S.stage);
  ensureDaily();
  bind(); resize(); spawn(); renderTabs(); renderSkills(); renderPanel(true);
  if (!S.introSeen) {
    S.introSeen = true;
    openModal(`<h3>Leyendas del Toque</h3><p>La niebla de Brumaluz trajo monstruos a cada camino. Tú tienes un dedo veloz y muchas ganas de oro.</p>
    <p>Toca al monstruo para atacar, contrata aliados, completa capítulos de historia y misiones diarias, atrapa cofres alados y gira la rueda.</p>
    <div class="btns"><button class="btn" data-close>Empezar la aventura</button></div>`);
  } else offlineCheck();
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(() => S); } catch (e) { /* opcional */ } }
  requestAnimationFrame(t => { lastT = t; loop(t); });
}
start();
})();
</script>
